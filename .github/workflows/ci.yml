name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Under build/, which is gitignored, so the package checkout can be cached by path.
  PACKAGES_DIR: build/SourcePackages

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      # First, so a formatting slip fails in seconds rather than after a full build.
      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive --parallel Ondu OnduTests

      - uses: actions/cache@v6
        with:
          path: ${{ env.PACKAGES_DIR }}
          key: spm-${{ hashFiles('Ondu.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Both platforms, because a change made on one routinely breaks the other: an
      # AppKit type outside its #if os(macOS) only shows up in the iOS build.
      - name: Build for macOS
        run: >
          xcodebuild -scheme Ondu -destination 'platform=macOS'
          -clonedSourcePackagesDirPath "$PACKAGES_DIR"
          CODE_SIGNING_ALLOWED=NO -quiet build

      # Serial on purpose, as in CLAUDE.md: parallel simulator clones fail unreliably.
      # The step timeout turns a crashed test host — which hangs rather than failing —
      # into a failed run instead of a stuck one. Signing stays on: the simulator's
      # keychain refuses an unsigned app, and with no team set the build signs itself
      # ad hoc, which needs no certificate. Diagnostics collection is off because after
      # a failure it waited out a 600-second timeout before reporting anything.
      - name: Test on iOS Simulator
        timeout-minutes: 20
        run: >
          xcodebuild -scheme Ondu -destination 'platform=iOS Simulator,name=iPhone 17'
          -parallel-testing-enabled NO
          -clonedSourcePackagesDirPath "$PACKAGES_DIR"
          test
